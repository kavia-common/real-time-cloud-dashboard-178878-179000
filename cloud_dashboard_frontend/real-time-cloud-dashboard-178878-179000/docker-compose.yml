version: "3.9"

services:
  backend:
    build:
      context: ./cloud_dashboard_backend
    image: cloud-dashboard-backend:latest
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - SOCKET_PATH=${SOCKET_PATH:-/socket.io}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:5000}
      - SOCKET_URL=${SOCKET_URL:-http://localhost:5000}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-1000}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app

  frontend:
    build:
      context: ./cloud_dashboard_frontend
    image: cloud-dashboard-frontend:latest
    environment:
      # Build-time vars should be provided via .env or docker build args for local builds
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL:-http://localhost:5000}
      - REACT_APP_SOCKET_URL=${REACT_APP_SOCKET_URL:-http://localhost:5000}
      - REACT_APP_SOCKET_PATH=${REACT_APP_SOCKET_PATH:-/socket.io}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - app

networks:
  app:
    driver: bridge
